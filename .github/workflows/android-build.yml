name: Android APK Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:   # 可在 Actions 頁手動觸發

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle Wrapper
        run: |
          sudo apt-get update && sudo apt-get install -y gradle
          gradle wrapper --gradle-version 8.4 --distribution-type bin
          chmod +x gradlew

      - name: Build Debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee /tmp/build_output.log

      - name: Report build errors on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          grep -a -E "^e: |error:|FAILED|What went wrong|Execution failed|Caused by|Could not|> " /tmp/build_output.log | head -120 > /tmp/errors.txt || true
          echo "===== TAIL =====" >> /tmp/errors.txt
          tail -60 /tmp/build_output.log >> /tmp/errors.txt
          {
            echo "Build failed. Error excerpt:"
            echo '```'
            head -c 6000 /tmp/errors.txt
            echo '```'
          } > /tmp/issue_body.md
          gh issue create --title "Build failure report" --body-file /tmp/issue_body.md || true
          cp /tmp/errors.txt build_errors.txt
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git checkout -B build-report
          git add build_errors.txt
          git commit -m "build errors $(date -u +%FT%TZ)" || true
          git push -f origin build-report || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RemoteDev-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Rename APK with version
        run: |
          VERSION="1.0.${{ github.run_number }}"
          cp app/build/outputs/apk/debug/app-debug.apk "RemoteDev-v${VERSION}-debug.apk"
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: RemoteDev v${{ env.VERSION }}
          body: |
            自動建置的 Debug APK
            - Commit: ${{ github.sha }}
            - 建置時間(UTC): ${{ github.event.head_commit.timestamp }}
          files: RemoteDev-v${{ env.VERSION }}-debug.apk
          prerelease: false
          generate_release_notes: true
