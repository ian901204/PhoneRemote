name: Android APK Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:   # 可在 Actions 頁手動觸發

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle Wrapper
        run: |
          sudo apt-get update && sudo apt-get install -y gradle
          gradle wrapper --gradle-version 8.4 --distribution-type bin
          chmod +x gradlew

      - name: Build Debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee /tmp/build_output.log

      - name: Report build errors on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          grep -a -E "^e: |error:|FAILED|What went wrong|Execution failed|Caused by" /tmp/build_output.log | head -80 > /tmp/errors.txt || true
          {
            echo "Build failed. Error excerpt:"
            echo '```'
            head -c 6000 /tmp/errors.txt
            echo '```'
          } > /tmp/issue_body.md
          gh issue create --title "Build failure report" --body-file /tmp/issue_body.md || true
          cp /tmp/errors.txt build_errors.txt
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git checkout -B build-report
          git add build_errors.txt
          git commit -m "build errors $(date -u +%FT%TZ)" || true
          git push -f origin build-report || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RemoteDev-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
