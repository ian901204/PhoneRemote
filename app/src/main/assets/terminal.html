<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css"/>
<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
<style>
  html, body, #terminal { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
  .xterm { padding: 4px; }
</style>
</head>
<body>
<div id="terminal"></div>
<script>
  const term = new Terminal({
    cursorBlink: true,
    fontSize: 13,
    fontFamily: 'Menlo, Consolas, monospace',
    theme: {
      background: '#000000',
      foreground: '#d4ffd4',
      cursor: '#33ff66',
    },
    scrollback: 5000,
    convertEol: false,
  });
  const fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  term.open(document.getElementById('terminal'));
  fit.fit();

  // 使用者輸入 → Android
  term.onData(function(d) { AndroidInput.onInput(btoa(unescape(encodeURIComponent(d)))); });

  window.addEventListener('resize', function() { fit.fit(); });

  // Android → 終端 (base64 UTF-8)
  const decoder = new TextDecoder('utf-8');
  window.writeB64 = function(b64) {
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    term.write(decoder.decode(bytes));
  };
  window.clearTerm = function() { term.clear(); };
  term.focus();
</script>
</body>
</html>
